
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="DOSCO — thoughtful digital solutions, made simple.">
  <title>DOSCO — Digital Solutions, Made Simple</title>

  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --primary: #635bff;
      --primary-dark: #4f46e5;
      --accent: #18c6a3;
      --line: #e6eaf2;
      --shadow: 0 20px 55px rgba(24,35,64,.10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin-inline: auto;
    }

    /* Navigation */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--primary), #9a62ff);
      box-shadow: 0 8px 18px #635bff40;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      color: #475467;
      font-size: .94rem;
      font-weight: 600;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      border: 0;
      cursor: pointer;
      padding: 13px 20px;
      border-radius: 13px;
      font-weight: 750;
      transition: transform .2s, box-shadow .2s, background .2s;
    }

    .button:hover { transform: translateY(-2px); }

    .button-primary {
      color: white;
      background: var(--primary);
      box-shadow: 0 10px 24px #635bff36;
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    .button-light {
      color: var(--ink);
      background: white;
      border: 1px solid var(--line);
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer;
      font-size: 1.25rem;
    }

    /* Hero */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 92px 0 88px;
      background: #101827;
      color: white;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero::before {
      width: 480px;
      height: 480px;
      right: -120px;
      top: -230px;
      background: radial-gradient(circle, #635bff60, transparent 68%);
    }

    .hero::after {
      width: 400px;
      height: 400px;
      left: 30%;
      bottom: -330px;
      background: radial-gradient(circle, #18c6a34a, transparent 68%);
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 64px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #b7b3ff;
      text-transform: uppercase;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .15em;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px #18c6a31d;
    }

    h1 {
      margin: 18px 0 20px;
      max-width: 650px;
      font-size: clamp(2.8rem, 5.4vw, 4.8rem);
      line-height: 1.06;
      letter-spacing: -.055em;
    }

    .gradient-text { color: #a8a2ff; }

    .hero-copy {
      max-width: 540px;
      color: #c3ccdc;
      font-size: 1.12rem;
      margin: 0 0 30px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero .button-light {
      color: white;
      background: #ffffff0d;
      border-color: #ffffff2a;
    }

    .hero-note {
      margin-top: 24px;
      color: #9ca8bc;
      font-size: .88rem;
    }

    /* Dashboard illustration */

    .visual-wrap {
      position: relative;
      padding: 18px;
    }

    .dashboard {
      position: relative;
      padding: 24px;
      border: 1px solid #ffffff22;
      border-radius: 28px;
      background: linear-gradient(145deg, #ffffff16, #ffffff06);
      box-shadow: 0 35px 90px #00000040;
      backdrop-filter: blur(12px);
      transform: rotate(1.5deg);
    }

    .dash-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      color: #dce2f0;
      font-size: .85rem;
    }

    .dots { display: flex; gap: 6px; }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff50;
    }

    .dash-panel {
      background: #101827b5;
      border: 1px solid #ffffff14;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 14px;
    }

    .dash-label {
      color: #9ca8bc;
      font-size: .8rem;
    }

    .dash-number {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 3px;
      letter-spacing: -.04em;
    }

    .dash-positive {
      color: #52e2c1;
      font-size: .78rem;
      margin-left: 8px;
    }

    .chart {
      display: flex;
      height: 110px;
      align-items: end;
      gap: 9px;
      margin-top: 16px;
    }

    .chart span {
      flex: 1;
      border-radius: 7px 7px 2px 2px;
      background: linear-gradient(180deg, #a49eff, #635bff70);
    }

    .chart span:nth-child(1) { height: 32%; }
    .chart span:nth-child(2) { height: 48%; }
    .chart span:nth-child(3) { height: 40%; }
    .chart span:nth-child(4) { height: 64%; }
    .chart span:nth-child(5) { height: 55%; }
    .chart span:nth-child(6) { height: 78%; }
    .chart span:nth-child(7) { height: 68%; }

    .chart span:nth-child(8) {
      height: 96%;
      background: linear-gradient(180deg, #51e4c2, #18c6a370);
    }

    .float-chip {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      color: #101827;
      background: white;
      border-radius: 15px;
      box-shadow: var(--shadow);
      font-size: .82rem;
      font-weight: 750;
    }

    .float-chip .chip-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: #eeedff;
      border-radius: 10px;
    }

    .chip-one { top: 0; right: -6px; }
    .chip-two { bottom: 0; left: -10px; }

    /* Shared sections */

    section { padding: 88px 0; }

    .section-heading {
      max-width: 650px;
      margin: 0 auto 44px;
      text-align: center;
    }

    .section-kicker {
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: .75rem;
      font-weight: 850;
    }

    h2 {
      margin: 10px 0 13px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -.045em;
      line-height: 1.15;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 1.04rem;
    }

    /* Services */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service-card {
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      transition: transform .25s, box-shadow .25s;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
    }

    .service-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--primary);
      background: #efeeff;
      font-size: 1.45rem;
    }

    .service-card:nth-child(2) .service-icon {
      color: #099b7f;
      background: #e3fbf4;
    }

    .service-card:nth-child(3) .service-icon {
      color: #b36b0a;
      background: #fff3db;
    }

    .service-card h3 {
      margin: 20px 0 9px;
      font-size: 1.15rem;
    }

    .service-card p {
      margin: 0;
      color: var(--muted);
      font-size: .94rem;
    }

    /* About */

    .about {
      background: white;
      border-block: 1px solid var(--line);
    }

    .about-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 70px;
      align-items: center;
    }

    .about-art {
      min-height: 340px;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(145deg, #e9e8ff, #dffaf3);
      display: grid;
      place-items: center;
    }

    .orbit {
      width: 230px;
      height: 230px;
      border: 1px solid #635bff4c;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      border: 1px solid #635bff36;
      border-radius: 50%;
    }

    .orbit::before { inset: 25px; }
    .orbit::after { inset: 52px; }

    .orbit-core {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--primary), #9a62ff);
      border-radius: 27px;
      font-weight: 900;
      font-size: 1.4rem;
      box-shadow: 0 15px 35px #635bff50;
      z-index: 1;
    }

    .orbit-node {
      position: absolute;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 22px #22223b16;
      font-size: 1.1rem;
    }

    .node-a { top: 20px; left: 25px; }
    .node-b { top: 38px; right: 0; }
    .node-c { bottom: 18px; left: 30px; }
    .node-d { bottom: 22px; right: 23px; }

    .about-copy h2 { margin-top: 12px; }
    .about-copy > p { color: var(--muted); }

    .check-list {
      list-style: none;
      padding: 0;
      margin: 24px 0 0;
      display: grid;
      gap: 12px;
    }

    .check-list li {
      display: flex;
      align-items: start;
      gap: 11px;
      font-weight: 650;
    }

    .check {
      flex: 0 0 23px;
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #087f68;
      background: #ddf9f1;
      font-size: .8rem;
      margin-top: 2px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 36px;
    }

    .stat {
      border-left: 2px solid var(--line);
      padding-left: 16px;
    }

    .stat strong {
      display: block;
      font-size: 1.7rem;
      letter-spacing: -.04em;
    }

    .stat span {
      color: var(--muted);
      font-size: .84rem;
    }

    /* Contact */

    .contact-section { background: #f6f8fc; }

    .contact-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 50px;
      align-items: start;
    }

    .contact-copy p { color: var(--muted); }

    .contact-detail {
      display: flex;
      gap: 13px;
      align-items: center;
      margin-top: 22px;
    }

    .contact-detail .service-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      font-size: 1.1rem;
    }

    .contact-detail small {
      display: block;
      color: var(--muted);
    }

    .contact-form {
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 12px 35px #1823400a;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field { margin-bottom: 17px; }

    label {
      display: block;
      font-weight: 700;
      font-size: .88rem;
      margin-bottom: 7px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #dce2ec;
      background: #fbfcff;
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--ink);
      outline: none;
      transition: border .2s, box-shadow .2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px #635bff16;
    }

    textarea {
      resize: vertical;
      min-height: 125px;
    }

    .form-note {
      color: var(--muted);
      font-size: .8rem;
      margin: 12px 0 0;
    }

    .form-status {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #e3fbf4;
      color: #087f68;
      font-size: .9rem;
    }

    .form-status.show { display: block; }

    /* Call to action */

    .cta-band { padding: 0 0 88px; }

    .cta-inner {
      padding: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      color: white;
      background: linear-gradient(115deg, #5148eb, #7966ff);
      border-radius: 26px;
      box-shadow: 0 20px 45px #635bff2b;
    }

    .cta-inner h2 {
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      margin: 0 0 8px;
    }

    .cta-inner p {
      color: #e5e3ff;
      margin: 0;
    }

    .cta-inner .button {
      flex-shrink: 0;
      color: var(--primary-dark);
      background: white;
    }

    /* Footer */

    footer {
      background: #101827;
      color: #c3ccdc;
      padding: 30px 0;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    footer .brand {
      color: white;
      font-size: 1.05rem;
    }

    footer .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      font-size: .88rem;
    }

    .copyright {
      font-size: .82rem;
      color: #8e9bb0;
    }

    /* Back-to-top button */

    .back-top {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      box-shadow: 0 8px 20px #635bff45;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: .2s;
      z-index: 30;
    }

    .back-top.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Scroll animations */

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .6s ease, transform .6s ease;
    }

    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    /* Tablet */

    @media (max-width: 850px) {
      .hero { padding: 70px 0; }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 42px;
      }

      .hero-copy { max-width: 650px; }

      .visual-wrap {
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
      }

      .about-grid, .contact-grid {
        grid-template-columns: 1fr;
        gap: 38px;
      }

      .about-art { min-height: 300px; }

      .services-grid {
        grid-template-columns: 1fr 1fr;
      }

      .services-grid .service-card:last-child {
        grid-column: 1 / -1;
      }

      .nav-links { gap: 18px; }
    }

    /* Mobile */

    @media (max-width: 620px) {
      .container {
        width: min(100% - 30px, 1120px);
      }

      .nav { min-height: 68px; }
      .menu-toggle { display: inline-block; }
      .nav-cta { display: none; }

      .nav-links {
        display: none;
        position: absolute;
        top: 68px;
        left: 0;
        right: 0;
        padding: 18px 22px 22px;
        background: white;
        border-bottom: 1px solid var(--line);
        box-shadow: 0 18px 25px #1018270d;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
      }

      .nav-links.open { display: flex; }
      .nav-links a { padding: 12px 0; }

      .hero { padding: 58px 0 65px; }

      h1 {
        font-size: clamp(2.55rem, 12vw, 3.8rem);
      }

      .hero-copy { font-size: 1rem; }
      .visual-wrap { padding: 12px 4px; }

      .dashboard {
        padding: 17px;
        border-radius: 22px;
      }

      .chip-one { right: -3px; }
      .chip-two { left: -2px; }

      .float-chip {
        padding: 9px 11px;
        font-size: .72rem;
      }

      .float-chip .chip-icon {
        width: 27px;
        height: 27px;
      }

      section { padding: 68px 0; }

      .section-heading { margin-bottom: 30px; }

      .services-grid { grid-template-columns: 1fr; }
      .services-grid .service-card:last-child { grid-column: auto; }

      .service-card { padding: 24px; }
      .about-art { min-height: 270px; }
      .stats { gap: 10px; }
      .stat { padding-left: 10px; }

      .stat strong { font-size: 1.35rem; }
      .stat span { font-size: .75rem; }

      .contact-form { padding: 22px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }

      .cta-band { padding-bottom: 68px; }

      .cta-inner {
        padding: 28px 24px;
        align-items: flex-start;
        flex-direction: column;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-links { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="#home" aria-label="DOSCO home">
        <span class="brand-mark">D</span>
        <span>DOSCO</span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>

      <a class="button button-primary nav-cta" href="#contact">
        Let's talk <span aria-hidden="true">↗</span>
      </a>

      <button class="menu-toggle" id="menuToggle"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="navLinks">☰</button>
    </div>
  </header>

  <main>

    <!-- Hero -->
    <section class="hero" id="home">
      <div class="container hero-grid">

        <div class="hero-content">
          <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            Ideas into impact
          </div>

          <h1>
            Make your next big idea
            <span class="gradient-text">happen.</span>
          </h1>

          <p class="hero-copy">
            Welcome to DOSCO — a modern home for smart ideas,
            meaningful experiences, and digital solutions that
            move you forward.
          </p>

          <div class="hero-actions">
            <a class="button button-primary" href="#services">
              Explore what we do <span aria-hidden="true">→</span>
